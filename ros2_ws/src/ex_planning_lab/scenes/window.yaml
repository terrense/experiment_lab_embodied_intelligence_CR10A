name: window
description: >-
  A wall across the work side (x = -0.90 m) with a 0.50 x 0.40 m window. Start TCP on the robot side,
  goal TCP beyond the wall: the forearm must thread the window. Narrow-passage scene, the classic
  failure mode of uniform-sampling planners. Queries are sampled reproducibly (seed) and validated.
boxes:
  - {name: table,        center: [0.0, 0.0, -0.03],    size: [2.0, 2.0, 0.04]}
  - {name: wall_left,    center: [-0.90, 0.525, 0.65], size: [0.04, 0.95, 1.30]}
  - {name: wall_right,   center: [-0.90, -0.725, 0.65], size: [0.04, 0.55, 1.30]}
  - {name: wall_bottom,  center: [-0.90, -0.20, 0.225], size: [0.04, 0.50, 0.45]}
  - {name: wall_top,     center: [-0.90, -0.20, 1.075], size: [0.04, 0.50, 0.45]}
sample_queries:
  n: 3
  seed: 1
  start_tcp_box: {lo: [-0.60, -0.50, 0.40], hi: [-0.30, 0.30, 0.90]}
  goal_tcp_box:  {lo: [-1.25, -0.40, 0.50], hi: [-1.00, 0.00, 0.80]}
