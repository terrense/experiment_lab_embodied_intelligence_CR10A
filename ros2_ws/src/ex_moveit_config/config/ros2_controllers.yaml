controller_manager:
  ros__parameters:
    update_rate: 100
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Without per-joint tolerances JTC reports SUCCESS when the time runs out, even if the plant
    # never moved (observed 2026-10-27 with a crashed MuJoCo plant). Tolerances make it check.
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 1.0
      joint1: {trajectory: 0.15, goal: 0.005}
      joint2: {trajectory: 0.15, goal: 0.005}
      joint3: {trajectory: 0.15, goal: 0.005}
      joint4: {trajectory: 0.15, goal: 0.005}
      joint5: {trajectory: 0.15, goal: 0.005}
      joint6: {trajectory: 0.15, goal: 0.005}
